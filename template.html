    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

        <!-- Open Graph -->
        <meta property="og:image" content="https://www.bardio.cz/images/open_graph/og_3_landings.jpg">

        <meta name="twitter:card" content="summary_large_image">

        <meta name="twitter:description" content="Překvapte písničkou, která mluví za vás. Zjistěte, jak vzniká pisnička propojením vás, textaře a technologie.">
        <meta name="twitter:image" content="https://www.bardio.cz/images/open_graph/og_3_landings.jpg">
        
    
    <style>
        /* Animace */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* Page-specific styles for template */
        body {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #f0fdf4 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 20%, rgba(14, 165, 233, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
            animation: fadeIn 1s ease-in;
        }

        .template-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 1rem;
            position: relative;
            z-index: 2;
            min-height: 100vh;
        }

        .hero-image-wrapper {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
            animation: fadeInUp 0.8s ease-out 0s both;
        }

        .hero-image {
            max-width: 400px;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 20px 40px rgba(14, 165, 233, 0.3));
            animation: float 6s ease-in-out infinite;
            position: relative;
            z-index: 1;
        }

        .hero-image::after {
            content: "";
            position: absolute;
            top: -30px;
            left: -30px;
            right: -30px;
            bottom: -30px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.25) 0%, rgba(16, 185, 129, 0.15) 50%, transparent 80%);
            border-radius: 50%;
            z-index: -1;
            animation: pulse 3s ease-in-out infinite;
        }

        /* Decorative musical notes */
        .musical-notes {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .note {
            position: absolute;
            font-size: 2rem;
            opacity: 0.15;
            animation: float 8s ease-in-out infinite;
        }

        .note:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
        .note:nth-child(2) { top: 20%; right: 15%; animation-delay: 2s; }
        .note:nth-child(3) { bottom: 15%; left: 20%; animation-delay: 4s; }
        .note:nth-child(4) { bottom: 25%; right: 10%; animation-delay: 1s; }

        .template-header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInUp 1s ease-out 0.4s both;
        }

        .template-title {
            font-size: 3rem;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
            animation: shimmer 3s linear infinite;
        }


        .audio-player-container {
            margin: 2rem auto 3rem;
            max-width: 600px;
            position: relative;
            z-index: 1;
            animation: fadeInUp 1s ease-out 0.2s both;
        }

        .audio-player-container audio {
            width: 100%;
            outline: none;
        }

        .download-container {
            text-align: center;
            margin: 3rem 0;
            animation: fadeInUp 0.8s ease-out 0.6s both;
        }

        .download-btn {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--white);
            padding: 1.25rem 2.5rem;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.15rem;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 20px rgba(14, 165, 233, 0.35);
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(14, 165, 233, 0.5);
        }

        .template-footer {
            text-align: center;
            padding-top: 2rem;
            border-top: 1px solid var(--gray-200);
            margin-top: 3rem;
        }

        .template-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .template-footer a:hover {
            color: var(--secondary);
            text-decoration: underline;
        }

        .template-footer p {
            color: var(--gray-600);
            margin-bottom: 0.5rem;
        }

        .template-footer {
            animation: fadeInUp 1s ease-out 0.8s both;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .template-container {
                padding: 2rem 1rem;
            }

            .template-title {
                font-size: 2rem;
            }

            .download-btn {
                padding: 1rem 2rem;
                font-size: 1rem;
            }

            .hero-image {
                max-width: 280px;
            }
        }
    </style>
</head>
<body>
    <div class="template-container">
        <!-- Decorative musical notes -->
        <div class="musical-notes">
            <div class="note">♪</div>
            <div class="note">♫</div>
            <div class="note">♪</div>
            <div class="note">♫</div>
        </div>

        <!-- Hero image with animation -->
        <div class="hero-image-wrapper">
            <img src="images/bard_hero.png" alt="Bardio - Váš osobní bard" class="hero-image">
        </div>

        <!-- Přehrávač -->
        <div class="audio-player-container">

            <p>Kontakt: <a href="mailto:podpora@bardio.cz">podpora@bardio.cz</a></p>
        </div>
    </div>
