<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>420250001 – Vaše písnička na přání - Bardio.cz</title>
    <meta name="description" content="Vaše osobní píseň na míru je hotová! Poslechněte si ji a stáhněte.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://www.bardio.cz/styles.css">
    
    <style>
        /* Animace */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* Page-specific styles for template */
        body {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #f0fdf4 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 20%, rgba(14, 165, 233, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
            animation: fadeIn 1s ease-in;
        }

        .template-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 1rem;
            position: relative;
            z-index: 2;
            min-height: 100vh;
        }

        .hero-image-wrapper {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
            animation: fadeInUp 0.8s ease-out 0s both;
        }

        .hero-image {
            max-width: 400px;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 20px 40px rgba(14, 165, 233, 0.3));
            animation: float 6s ease-in-out infinite;
            position: relative;
            z-index: 1;
        }

        .hero-image::after {
            content: "";
            position: absolute;
            top: -30px;
            left: -30px;
            right: -30px;
            bottom: -30px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.25) 0%, rgba(16, 185, 129, 0.15) 50%, transparent 80%);
            border-radius: 50%;
            z-index: -1;
            animation: pulse 3s ease-in-out infinite;
        }

        /* Decorative musical notes */
        .musical-notes {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .note {
            position: absolute;
            font-size: 2rem;
            opacity: 0.15;
            animation: float 8s ease-in-out infinite;
        }

        .note:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
        .note:nth-child(2) { top: 20%; right: 15%; animation-delay: 2s; }
        .note:nth-child(3) { bottom: 15%; left: 20%; animation-delay: 4s; }
        .note:nth-child(4) { bottom: 25%; right: 10%; animation-delay: 1s; }

        .template-header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInUp 1s ease-out 0.4s both;
        }

        .template-title {
            font-size: 3rem;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
            animation: shimmer 3s linear infinite;
        }


        .audio-player-container {
            margin: 2rem auto 3rem;
            max-width: 600px;
            position: relative;
            z-index: 1;
            animation: fadeInUp 1s ease-out 0.2s both;
        }

        .audio-player-label {
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 0.75rem;
            font-size: 1.1rem;
            text-align: center;
        }

        .audio-player-container audio {
            width: 100%;
            outline: none;
        }

        .download-container {
            text-align: center;
            margin: 3rem 0;
            animation: fadeInUp 0.8s ease-out 0.6s both;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        .download-btn {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--white);
            padding: 1.25rem 2.5rem;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.15rem;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 20px rgba(14, 165, 233, 0.35);
            width: 100%;
            max-width: 400px;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(14, 165, 233, 0.5);
        }

        .template-footer {
            text-align: center;
            padding-top: 2rem;
            border-top: 1px solid var(--gray-200);
            margin-top: 3rem;
        }

        .template-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .template-footer a:hover {
            color: var(--secondary);
            text-decoration: underline;
        }

        .template-footer p {
            color: var(--gray-600);
            margin-bottom: 0.5rem;
        }

        .template-footer {
            animation: fadeInUp 1s ease-out 0.8s both;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .template-container {
                padding: 2rem 1rem;
            }

            .template-title {
                font-size: 2rem;
            }

            .download-btn {
                padding: 1rem 2rem;
                font-size: 1rem;
            }

            .hero-image {
                max-width: 280px;
            }
        }
    </style>
</head>
<body>
    <div class="template-container">
        <!-- Decorative musical notes -->
        <div class="musical-notes">
            <div class="note">♪</div>
            <div class="note">♫</div>
            <div class="note">♪</div>
            <div class="note">♫</div>
        </div>

        <!-- Hero image with animation -->
        <div class="hero-image-wrapper">
            <img src="https://www.bardio.cz/images/bard_hero.png" alt="Bardio - Váš osobní bard" class="hero-image">
        </div>

        <!-- Přehrávače (všechny verze od nejvyššího po nejnižší: 10, 9, ..., 2, 1) -->
        
        
        <!-- Přehrávač pro verzi 1 (základní) -->
        <div class="audio-player-container">
            
            <audio controls>
                <source src="https://media.bardio.cz/0b9d7d9b67c2b505/420250001.mp3" type="audio/mpeg">
                Váš prohlížeč nepodporuje přehrávání audia.
            </audio>
        </div>

        <!-- Claim -->
        <div class="template-header">
            <h1 class="template-title">Posíláme písničku, <br>která vydá za tisíc slov</br></h1>
        </div>

        <!-- Tlačítka ke stažení (všechny verze od nejvyššího po nejnižší: 10, 9, ..., 1, 0) -->
        <div class="download-container">
            
            <a href="https://media.bardio.cz/0b9d7d9b67c2b505/420250001.mp3" download class="download-btn">Stáhnout MP3</a>
        </div>

        <div class="template-footer">
            <p><a href="https://www.bardio.cz">Bardio.cz</a> - Vytváříme osobní písně na míru</p>
            <p>Kontakt: <a href="mailto:podpora@bardio.cz">podpora@bardio.cz</a></p>
        </div>
    </div>

    <script>
        // Funkce pro stahování souboru místo otevření v prohlížeči
        document.addEventListener('DOMContentLoaded', function() {
            const downloadButtons = document.querySelectorAll('.download-btn');
            
            downloadButtons.forEach(button => {
                button.addEventListener('click', async function(e) {
                    e.preventDefault(); // Zabraň výchozímu chování
                    
                    const url = this.getAttribute('href');
                    // Extrahuj název souboru z URL (poslední část cesty)
                    const urlParts = url.split('/');
                    const fileNameFromUrl = urlParts[urlParts.length - 1].split('?')[0]; // Odeber query parametry
                    // Pokud název souboru není v URL, použij text z tlačítka
                    const fileName = fileNameFromUrl && fileNameFromUrl.endsWith('.mp3') 
                        ? fileNameFromUrl 
                        : this.textContent.trim().replace(/\s+/g, '-').toLowerCase() + '.mp3';
                    
                    try {
                        // Zobraz indikátor načítání
                        const originalText = this.textContent;
                        this.textContent = 'Stahuji...';
                        this.style.opacity = '0.7';
                        this.style.pointerEvents = 'none';
                        
                        // Stáhni soubor pomocí fetch
                        const response = await fetch(url);
                        if (!response.ok) {
                            throw new Error('Chyba při stahování souboru');
                        }
                        
                        const blob = await response.blob();
                        const blobUrl = window.URL.createObjectURL(blob);
                        
                        // Vytvoř dočasný odkaz pro stahování
                        const downloadLink = document.createElement('a');
                        downloadLink.href = blobUrl;
                        downloadLink.download = fileName;
                        downloadLink.style.display = 'none';
                        document.body.appendChild(downloadLink);
                        
                        // Spusť stahování
                        downloadLink.click();
                        
                        // Vyčisti
                        document.body.removeChild(downloadLink);
                        window.URL.revokeObjectURL(blobUrl);
                        
                        // Obnov tlačítko
                        this.textContent = originalText;
                        this.style.opacity = '1';
                        this.style.pointerEvents = 'auto';
                    } catch (error) {
                        console.error('Chyba při stahování:', error);
                        // V případě chyby použij výchozí chování
                        window.open(url, '_blank');
                        
                        // Obnov tlačítko
                        const originalText = this.textContent.replace('Stahuji...', '');
                        this.textContent = originalText;
                        this.style.opacity = '1';
                        this.style.pointerEvents = 'auto';
                    }
                });
            });
        });
    </script>
</body>
</html>
